[package]
name = "alignroute"
version = "0.1.0"
edition = "2024"
description = "ALIGN PnR 배선기(RouteWork 4·5·2·3)를 그대로 옮긴 것 — 모듈 하나를 배선한다 (wasm 으로 페이지에서 돈다)"
# ALIGN-public (BSD-3-Clause) 의 PlaceRouteHierFlow/router 를 옮겼다. lp_solve 5.5 (LGPL-2.1) 는
# 소스를 받아 같이 빌드한다 (fetch-lpsolve.sh).
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "alignroute"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: unit_R 같은 f64 를 C++ 과 같은 비트로 읽는다
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# build.sh --dev: 결과는 같고 빌드만 빠르다
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
