[package]
name = "symroute"
version = "0.1.0"
edition = "2024"
description = "격자 배선기 — src/route/problem.mjs 의 배선 문제를 푼다 (wasm 으로 페이지에서 돈다)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "symroute"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
